name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1 : Vérifier le code
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest


  # JOB 2 : Construire et publier l'image Docker
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Calculate application version
        id: app-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.value }}


  # JOB 3 : Déploiement staging
  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start commit image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api:sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "Image utilisée : $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name tasks-api -p 8000:8000 "$IMAGE"

      - name: Smoke test staging
        run: |
          for attempt in {1..15}; do
            echo "Test de démarrage $attempt/15"

            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Test staging réussi !"
              exit 0
            fi

            sleep 2
          done

          echo "Échec du test staging"
          docker logs tasks-api
          exit 1


  # JOB 4 : Déploiement production avec approbation
  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start release image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api:${VERSION}"

          echo "Image utilisée : $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name tasks-api -p 8000:8000 "$IMAGE"

      - name: Smoke test production
        run: |
          for attempt in {1..15}; do
            echo "Test de démarrage $attempt/15"

            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Test production réussi !"
              exit 0
            fi

            sleep 2
          done

          echo "Échec du test production"
          docker logs tasks-api
          exit 1


  # JOB 5 : Mettre à jour automatiquement tasks-config
  update-config:
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Récupérer le dépôt applicatif
        uses: actions/checkout@v6

      - name: Récupérer le dépôt de configuration
        uses: actions/checkout@v6
        with:
          repository: ayoub3004-debug/tasks-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Mettre à jour la version de l'image
        run: bash scripts/set-image-tag.sh config/k8s/deployment.yaml "${VERSION#v}"

      - name: Commiter et pousser dans tasks-config
        run: |
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Déploiement de tasks-api ${VERSION#v}"
          git push