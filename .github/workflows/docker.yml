name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Calculate application version
        id: app-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.value }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start commit image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api:sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "Image utilisée : $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name tasks-api -p 8000:8000 "$IMAGE"

      - name: Smoke test staging
        run: |
          for attempt in {1..15}; do
            echo "Test de démarrage $attempt/15"
            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Test staging réussi !"
              exit 0
            fi
            sleep 2
          done
          echo "Échec du test staging"
          docker logs tasks-api
          exit 1

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start release image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api:${VERSION}"
          echo "Image utilisée : $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name tasks-api -p 8000:8000 "$IMAGE"

      - name: Smoke test production
        run: |
          for attempt in {1..15}; do
            echo "Test de démarrage $attempt/15"
            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Test production réussi !"
              exit 0
            fi
            sleep 2
          done
          echo "Échec du test production"
          docker logs tasks-api
          exit 1