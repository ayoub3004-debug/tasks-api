name: Secret Demo

on:
  workflow_dispatch:

jobs:
  demo-secret:
    runs-on: ubuntu-latest

    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
      APP_ENV: ${{ vars.APP_ENV }}

    steps:
      - name: Vérifier le secret
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Erreur : le secret est vide"
            exit 1
          fi

          echo "Le secret est présent."
          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Valeur du secret : $DEMO_TOKEN"
          echo "Environnement : $APP_ENV"